<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quên mật khẩu · SpendWise</title>
<script src="../js/theme.js"></script>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
  <main class="card auth-card">
    <div class="row-between">
      <a href="login.html" class="link-small">← Về đăng nhập</a>
      <button type="button" class="btn ghost sm theme-toggle" data-theme-toggle title="Đổi giao diện sáng/tối">🌙 Tối</button>
    </div>
    <h1 class="auth-title mt-4 mb-4">🔑 Quên mật khẩu</h1>
    <p class="text-soft text-small">
      Nhập email đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu (mô phỏng).
    </p>

    <form id="fpForm" class="mt-4" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" id="email" type="email" placeholder="ban@spendwise.vn">
        <p class="field-error" id="errEmail" hidden>Email chưa hợp lệ.</p>
      </div>
      <button class="btn primary w-full mt-3" type="submit" id="sendBtn">
        Gửi liên kết đặt lại
      </button>
    </form>

    <div class="empty" id="sentBox" hidden>
      <div class="icon">📨</div>
      <b>Đã gửi liên kết đặt lại!</b>
      <p class="mt-3">Kiểm tra hộp thư của bạn. Trong nguyên mẫu, liên kết không thực sự được gửi.</p>
      <a class="btn secondary sm mt-3" href="login.html">Về trang đăng nhập</a>
    </div>
  </main>

<!-- Bộ lõi dùng chung: dữ liệu → API → AI → layout -->
<script src="../js/data.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ai.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/layout.js"></script>


<script>
/* Trang forgot-password — Quên mật khẩu: kiểm tra email tồn tại và mô phỏng gửi liên kết đặt lại. */
(function () {
  "use strict";
  const { $, toast, clearErrors, markInvalid } = window.SW;

  $("#fpForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErrors("#fpForm");
    const email = $("#email").value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      markInvalid("#email", "#errEmail");
      return;
    }
    const btn = $("#sendBtn");
    btn.disabled = true;
    btn.textContent = "Đang gửi…";
    try {
      await window.API.list("users", (u) => u.email === email);
      $("#fpForm").hidden = true;
      $("#sentBox").hidden = false;
      toast("Đã gửi email đặt lại mật khẩu (mô phỏng).", "success");
    } catch (err) {
      toast(err.message, "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Gửi liên kết đặt lại";
    }
  });
})();
</script>
</body>
</html>
